name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    # Windows: pyautogui потребує сесії робочого столу, а тести малюють
    # макети вікна прийняття системними шрифтами
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v
